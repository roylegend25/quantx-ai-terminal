services:
  backend:
    build:
      context: ./backend
    container_name: quantx-backend
    restart: unless-stopped
    ports:
      - "9000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: quantx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantx
      POSTGRES_USER: quantx
      POSTGRES_PASSWORD: quantx_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: quantx-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
