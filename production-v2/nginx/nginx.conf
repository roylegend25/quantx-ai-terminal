# QuantX Production V2 — reverse proxy + edge blocklist.
#
# RESEARCH-classified API routes (AUDIT.md §2) are blocked here at the edge.
# Note (see ARCHITECTURE.md "Image size"): this narrows network exposure —
# it does NOT remove the underlying routers or their dependencies from the
# backend process, which still has them compiled in. Blocking here is the
# zero-risk, zero-code-change way to keep the 8 required pages as the only
# thing the public can reach on day 0.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=quantx_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=quantx_auth:10m rate=10r/m;

upstream quantx_backend {
    server backend:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge — must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS once a cert exists. deploy.sh runs
    # the initial cert issuance before this redirect is enabled — see
    # docs/DEPLOYMENT_GUIDE.md step 7.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- RESEARCH routes: blocked at the edge, see header comment ----
    location /api/ml/          { return 404; }
    location /api/research/    { return 404; }  # also covers /api/research/lab (research_lab router)
    location /api/backtest/    { return 404; }
    location /api/stress/      { return 404; }
    location /api/models/      { return 404; }
    location /api/learning/    { return 404; }

    # ---- Auth: tighter rate limit ----
    location = /api/auth/login {
        limit_req zone=quantx_auth burst=5 nodelay;
        proxy_pass http://quantx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- CORE API surface (everything else under /api/) ----
    location /api/ {
        limit_req zone=quantx_api burst=40 nodelay;
        proxy_pass http://quantx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://quantx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback. RESEARCH pages (BacktestingPage, ResearchLabPage, etc.)
    # are lazy-loaded chunks (App.tsx uses React.lazy) that are never fetched
    # unless something requests them by URL — which the /api/* blocks above
    # already prevent from working end-to-end. Their nav entries should also
    # be removed from the V2 build's Sidebar/Layout component; that's a small
    # frontend change tracked as a Day-1 follow-up, not required for day 0.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
