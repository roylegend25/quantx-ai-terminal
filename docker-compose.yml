services:
  backend:
    # Immutable application image. Update only after isolated validation;
    # never fall back to the legacy mutable V1 image during recreation.
    image: ${BACKEND_IMAGE:-quantx-backend:active-drive-v2-6a4373b}
    container_name: quantx-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      # The admin server-config panel edits the host .env through this
      # file mount (app/core/env_manager.py). Note: a bind-mounted FILE
      # cannot be atomically replaced from inside the container, hence
      # env_manager's backup-then-in-place-write fallback.
      - ./.env:/app/.env
    environment:
      # .env backups must outlive the container (only the .env file itself
      # is mounted) - the data volume is host-persistent and gitignored.
      ENV_BACKUP_DIR: /app/data/env-backups
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      APP_IMAGE_TAG: ${BACKEND_IMAGE:-quantx-ai-terminal-backend:latest}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: quantx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantx
      POSTGRES_USER: quantx
      POSTGRES_PASSWORD: quantx_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: quantx-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
